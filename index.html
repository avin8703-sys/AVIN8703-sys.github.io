<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>길드 아레나 확률 계산기</title>
<style>
:root{
  --bg:#17121e; --card:#241b2f; --line:#4c3a5c;
  --accent:#8d5bd0; --gold:#ffd66b; --purple:#c995ff;
  --text:#fff; --muted:#c8bad4;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
  background:#17121e;color:#fff;
}
.wrap{max-width:620px;margin:auto;padding:12px 12px 54px}
.hero,.card{
  background:#241b2f;border-radius:16px;padding:13px;margin-bottom:10px;
  border:1px solid rgba(255,255,255,.03);
}
.hero{
  background:linear-gradient(135deg,#6e44aa,#9a5ee8);
  padding:16px 15px;
}
.hero h1{
  margin:0 0 6px;font-size:22px;line-height:1.22;letter-spacing:-.6px;
}
.hero p{
  margin:0;font-size:12.5px;line-height:1.45;color:#f0e7ff;
}
h3{
  margin:0 0 10px;font-size:16px;line-height:1.25;letter-spacing:-.3px;
}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
button{
  padding:9px 5px;border:0;border-radius:11px;background:#3a2b49;color:#fff;
  font-size:13px;font-weight:800;cursor:pointer;
}
button.active{background:#8d5bd0}
.notice{
  margin:8px 0 0;font-size:11.5px;color:#c0b2ca;line-height:1.42;
}
.mission-list{display:grid;grid-template-columns:1fr;gap:6px}
.mission{
  position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:62px;background:#30243d;border:1px solid #4c3a5c;border-radius:12px;
  padding:7px 8px 7px 11px;cursor:pointer;transition:.12s;
}
.mission.selected{
  outline:2px solid #ffd66b;background:#392c40;
}
.mission-left{min-width:0;flex:1}
.name{
  font-size:15px;font-weight:850;line-height:1.2;letter-spacing:-.25px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rank-legend{color:#ffd66b}
.rank-epic{color:#c995ff}
.prob{font-size:11.5px;color:#c8bad4;margin-top:4px;line-height:1}
.icon-wrap{
  width:50px;height:50px;flex:0 0 50px;border-radius:11px;overflow:hidden;
  border:1px solid rgba(255,255,255,.12);box-shadow:0 2px 8px rgba(0,0,0,.22);
}
.icon-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.tick{
  display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
  margin-right:5px;border-radius:50%;border:1px solid #756386;font-size:11px;vertical-align:-2px;
}
.mission.selected .tick{background:#ffd66b;color:#2b2311;border-color:#ffd66b}
.reset{
  width:100%;margin-top:8px;padding:9px 8px;font-size:12px;
}
.result{
  background:#33263f;border-radius:13px;padding:12px;text-align:center;
}
.result-label{font-size:11.5px;color:#c8bad4}
.best{
  font-size:19px;font-weight:900;color:#ffd66b;margin:5px 0 9px;
}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{background:#211928;border-radius:10px;padding:8px;font-size:11.5px;color:#c8bad4}
.stat b{display:block;color:#fff;font-size:16px;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th,td{padding:7px 5px;border-bottom:1px solid #4a3858}
th{color:#c8bad4}
.num{text-align:right}
.top1{color:#ffd66b;font-weight:900}
@media(min-width:520px){
  .mission-list{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🎯 길드 아레나 확률 계산기</h1>
    <p>원하는 미션을 선택하면 가장 유리한 고정 미션을 계산합니다.</p>
  </div>

  <div class="card">
    <h3>1. 요일 선택</h3>
    <div class="tabs">
      <button data-day="월화">월·화</button>
      <button data-day="수목">수·목</button>
      <button class="active" data-day="금토일">금·토·일</button>
    </div>
    <p class="notice">파란색 미션은 새로고침 후보에서 제외하는 것으로 계산합니다.</p>
  </div>

  <div class="card">
    <h3>2. 원하는 미션 선택</h3>
    <div id="missions" class="mission-list"></div>
    <button id="resetBtn" class="reset">선택 초기화</button>
  </div>

  <div class="card">
    <h3>3. 추천 결과</h3>
    <div class="result">
      <div class="result-label">추천 고정 미션</div>
      <div id="best" class="best">목표 미션을 선택하세요</div>
      <div class="stats">
        <div class="stat">1회 성공확률<b id="success">-</b></div>
        <div class="stat">평균 필요 횟수<b id="average">-</b></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>추천 고정 미션 TOP 10</h3>
    <table>
      <thead><tr><th>순위</th><th>고정 미션</th><th class="num">기본확률</th><th class="num">성공확률</th></tr></thead>
      <tbody id="ranking"></tbody>
    </table>
  </div>

  <p class="notice">게임 화면에 표시된 반올림 확률을 기준으로 계산합니다. 실제 내부 확률과 미세한 차이가 있을 수 있습니다.</p>
</div>

let currentDay = "금토일";
let selected = new Set(["전설-훈장","전설-영주기어"]);

const missionsEl = document.getElementById("missions");
const bestEl = document.getElementById("best");
const successEl = document.getElementById("success");
const averageEl = document.getElementById("average");
const rankingEl = document.getElementById("ranking");
const resetBtn = document.getElementById("resetBtn");

function prettyName(name){
  const parts=name.split("-");
  const rank=parts.shift();
  const rest=parts.join("-");
  return `<span class="${rank==="전설"?"rank-legend":"rank-epic"}">${rank}</span>-${rest}`;
}

function renderMissions(){
  missionsEl.innerHTML="";
  DATA[currentDay].forEach(([name,p,iconKey])=>{
    const d=document.createElement("div");
    const isSelected=selected.has(name);
    d.className="mission"+(isSelected?" selected":"");
    d.innerHTML=`
      <div class="mission-left">
        <div class="name"><span class="tick">${isSelected?"✓":""}</span>${prettyName(name)}</div>
        <div class="prob">기본 확률 ${p.toFixed(2)}%</div>
      </div>
      <div class="icon-wrap"><img src="${ICONS[iconKey]}" alt=""></div>
    `;
    d.addEventListener("click",()=>{
      if(selected.has(name)) selected.delete(name); else selected.add(name);
      renderMissions(); calculate();
    });
    missionsEl.appendChild(d);
  });
}

function calculate(){
  const rows=DATA[currentDay];
  const goals=rows.filter(r=>selected.has(r[0]));
  const goalSum=goals.reduce((s,r)=>s+r[1],0);
  const total=rows.reduce((s,r)=>s+r[1],0);

  if(goals.length===0){
    bestEl.textContent="목표 미션을 선택하세요";
    successEl.textContent="-"; averageEl.textContent="-"; rankingEl.innerHTML="";
    return;
  }

  const candidates=rows
    .filter(r=>!selected.has(r[0]))
    .map(r=>({
      name:r[0], base:r[1],
      success:goalSum/(total-r[1])
    }))
    .sort((a,b)=>b.success-a.success || b.base-a.base || a.name.localeCompare(b.name,"ko"));

  const best=candidates[0];
  if(!best){
    bestEl.textContent="고정 가능한 미션이 없습니다";
    successEl.textContent="-"; averageEl.textContent="-"; rankingEl.innerHTML="";
    return;
  }

  bestEl.textContent=best.name;
  successEl.textContent=(best.success*100).toFixed(2)+"%";
  averageEl.textContent=(1/best.success).toFixed(1)+"회";
  rankingEl.innerHTML=candidates.slice(0,10).map((c,i)=>`
    <tr>
      <td class="${i===0?"top1":""}">${i+1}</td>
      <td class="${i===0?"top1":""}">${c.name}</td>
      <td class="num">${c.base.toFixed(2)}%</td>
      <td class="num ${i===0?"top1":""}">${(c.success*100).toFixed(2)}%</td>
    </tr>`).join("");
}

function setDefaults(day){
  selected.clear();
  if(day==="금토일"){selected.add("전설-훈장");selected.add("전설-영주기어");}
  else if(day==="월화"){selected.add("전설-펫사료");}
  else if(day==="수목"){selected.add("전설-비보조각");selected.add("전설-마법의돌 소모");}
}

document.querySelectorAll("[data-day]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentDay=btn.dataset.day;
    document.querySelectorAll("[data-day]").forEach(b=>b.classList.toggle("active",b===btn));
    setDefaults(currentDay); renderMissions(); calculate();
  });
});

resetBtn.addEventListener("click",()=>{
  selected.clear(); renderMissions(); calculate();
});

renderMissions(); calculate();
</script>
