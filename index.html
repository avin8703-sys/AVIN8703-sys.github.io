<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>길드 아레나 확률 계산기 TEST</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f1f8;
      color: #2f2438;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: min(90%, 420px);
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
      color: #6b3f8f;
    }

    p {
      line-height: 1.6;
      color: #5b5161;
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #6b3f8f;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #result {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #fff2bd;
      font-weight: bold;
      display: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🎯 길드 아레나 확률 계산기</h1>

    <p>
      GitHub Pages 연결 테스트용 화면입니다.<br>
      아래 버튼을 눌러보세요.
    </p>

    <button onclick="testCalculator()">
      테스트 실행
    </button>

    <div id="result">
      ✅ 정상 작동합니다!<br>
      이제 진짜 확률 계산기를 만들 수 있어요.
    </div>
  </div>

  <script>
    function testCalculator() {
      document.getElementById("result").style.display = "block";
    }
  </script>
</body>
</html>
